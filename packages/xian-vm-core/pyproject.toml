[build-system]
requires = ["maturin>=1.13.1,<2"]
build-backend = "maturin"

[project]
name = "xian-tech-vm-core"
version = "0.1.3"
description = "Native VM capability surface for the future Xian execution engine"
readme = "README.md"
license = "MIT AND BSD-2-Clause"
license-files = ["vendor/mpdecimal/COPYRIGHT.txt"]
authors = [{ name = "Xian Network", email = "info@xian.org" }]
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]
dependencies = ["xian-tech-contracting>=1.1.4,<2"]

[tool.uv]
# When developing this package directly, the project itself provides the VM.
no-sources-package = ["xian-tech-vm-core"]
# Local path installs must rebuild when the native code or Python binding changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "python/**/*.py" },
    { file = "../xian-numeric/Cargo.toml" },
    { file = "../xian-numeric/src/**/*.rs" },
    { file = "build.rs" },
    { file = "vendor/mpdecimal/**/*" },
]

[tool.maturin]
module-name = "xian_vm_core._native"
python-source = "python"
features = ["python-extension"]

[tool.uv.sources]
xian-tech-contracting = { path = "../..", editable = true }
