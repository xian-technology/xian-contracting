[package]
name = "xian-vm-core"
version = "0.1.3"
edition = "2021"
# Rust 1.98 ships the LLVM fix for rust-lang/rust#157750: older toolchains strip
# macOS libraries with a misaligned string table that macOS 27 refuses to load.
rust-version = "1.98"
license = "MIT AND BSD-2-Clause"
description = "Core IR and validation types for the future Xian VM"
repository = "https://github.com/xian-technology/xian-contracting"
homepage = "https://github.com/xian-technology/xian-contracting"

[lib]
name = "xian_vm_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python-extension = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
xian-numeric = { path = "../xian-numeric" }
# Contract deployment compiles source in the block host.
xian-compiler-core = { path = "../xian-compiler-core" }
# Transaction wire decoding and the static admission rules.
xian-fastpath-core = { path = "../xian-fastpath-core" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
hex = "0.4"
# Consensus arithmetic must not select host libm or architecture-specific kernels.
libm = { version = "=0.2.16", default-features = false, features = ["force-soft-floats"] }
memchr = { version = "2.8", default-features = false, features = ["std"] }
num-bigint = "0.4"
num-traits = "0.2"
pyo3 = { version = "0.29.0", optional = true, features = ["abi3-py314"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sha3 = "0.12"

[build-dependencies]
cc = "1.2"
pyo3-build-config = "0.29.0"

[dev-dependencies]
xian_zk = { package = "xian-zk", path = "../xian-zk" }
