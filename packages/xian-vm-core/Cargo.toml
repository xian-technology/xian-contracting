[package]
name = "xian-vm-core"
version = "0.1.4"
edition = "2021"
# Rust 1.98 ships the LLVM fix for rust-lang/rust#157750: older toolchains strip
# macOS libraries with a misaligned string table that macOS 27 refuses to load.
rust-version = "1.98"
license = "MIT AND OLDAP-2.8"
description = "Core IR and validation types for the future Xian VM"
repository = "https://github.com/xian-technology/xian-contracting"
homepage = "https://github.com/xian-technology/xian-contracting"

[lib]
name = "xian_vm_core"
crate-type = ["cdylib", "rlib"]

[features]
# The node build: the vendored LMDB store. The browser build is
# `--no-default-features --features wasm` (no C code, no Python).
default = ["lmdb"]
# The node's committed store (compiles vendor/lmdb with the C compiler).
lmdb = ["dep:cc"]
# The transaction engine (block executor, host, state view); the bindings
# below enable it.
engine = []
python-extension = [
    "engine",
    "lmdb",
    "dep:lru",
    "dep:pyo3",
    "pyo3/extension-module",
    "dep:pyo3-build-config",
]
wasm = ["engine", "dep:wasm-bindgen", "dep:getrandom"]

[dependencies]
xian-numeric = { path = "../xian-numeric" }
# Contract deployment compiles source in the block host.
xian-compiler-core = { path = "../xian-compiler-core" }
# Transaction wire decoding and the static admission rules.
xian-fastpath-core = { path = "../xian-fastpath-core" }
# Every node verifies zk proofs: the block host serves the zk syscalls.
# Its library is named `_native` (the Python module); this crate calls it `xian_zk`.
xian_zk = { package = "xian-zk", path = "../xian-zk" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
hex = "0.4"
# Consensus arithmetic must not select host libm or architecture-specific kernels.
libm = { version = "=0.2.16", default-features = false, features = ["force-soft-floats"] }
lru = { version = "0.19", default-features = false, optional = true }
memchr = { version = "2.8", default-features = false, features = ["std"] }
num-bigint = "0.4"
num-traits = "0.2"
pyo3 = { version = "0.29.0", optional = true, features = ["abi3-py314"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sha3 = "0.12"

# The browser binding. xian-zk's prover links `rand`, whose OS entropy source
# on wasm32 is the JS crypto API; the engine never draws from it (randomness
# in contracts is seeded from the transaction).
wasm-bindgen = { version = "0.2", optional = true }
getrandom = { version = "0.2", optional = true, features = ["js"] }

[build-dependencies]
cc = { version = "1.2", optional = true }
pyo3-build-config = { version = "0.29.0", optional = true }

