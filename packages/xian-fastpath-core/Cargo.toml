[package]
name = "xian-fastpath-core"
version = "0.1.0"
edition = "2021"
# Rust 1.98 ships the LLVM fix for rust-lang/rust#157750: older toolchains strip
# macOS libraries with a misaligned string table that macOS 27 refuses to load.
rust-version = "1.98"
license = "MIT"
description = "Rust fast paths for Xian transaction validation"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std"] }
hex = "0.4.3"
pyo3 = { version = "0.29.0", features = ["abi3-py314", "extension-module"] }
serde_json = "1.0.145"
