[package]
name = "xian-fastpath-core"
version = "0.2.0"
edition = "2021"
# Rust 1.98 ships the LLVM fix for rust-lang/rust#157750: older toolchains strip
# macOS libraries with a misaligned string table that macOS 27 refuses to load.
rust-version = "1.98"
license = "MIT"
description = "Xian transaction wire decoding and static admission rules"

[lib]
# A plain Rust library: xian-vm-core links it and exposes admission to Python.
name = "xian_fastpath_core"
crate-type = ["rlib"]

[dependencies]
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std"] }
hex = "0.4.3"
serde_json = "1.0.145"
